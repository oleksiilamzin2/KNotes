[workspace]
resolver = "3"
members = ["lib/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
knotes-core = { path = "lib/knotes-core" }
pulldown-cmark = { version = "0.13.6", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }

[profile.release]
lto = "thin"
debug = "line-tables-only"
