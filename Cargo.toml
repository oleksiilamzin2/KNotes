[workspace]
resolver = "3"
members = ["lib/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
knotes-core = { path = "lib/knotes-core" }
pulldown-cmark = { version = "0.13.6", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }
knotes-md = { path = "lib/knotes-md" }
knotes-synth = { path = "lib/knotes-synth" }
knotes-vault = { path = "lib/knotes-vault" }
knotes-index = { path = "lib/knotes-index" }
rusqlite = { version = "0.42.0", features = ["bundled", "array"] }
memmap2 = "0.9.12"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
unicode-normalization = "0.1.26"
notify = "8.2.2"
serde_json = "1.0.154"
knotes-search = { path = "lib/knotes-search" }
knotes-indexer = { path = "lib/knotes-indexer" }
knotes-app = { path = "lib/knotes-app" }
knotes-session = { path = "lib/knotes-session" }
knotes-editor = { path = "lib/knotes-editor" }
knotes-alloc = { path = "lib/knotes-alloc" }
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
rayon = "1.12.0"
tempfile = "3"
latex-rust = { version = "3.0.3", features = ["png"] }

[profile.release]
lto = "thin"
debug = "line-tables-only"
