[workspace]
resolver = "3"
members = ["lib/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
knotes-core = { path = "lib/knotes-core" }
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
knotes-md = { path = "lib/knotes-md" }
knotes-synth = { path = "lib/knotes-synth" }
knotes-vault = { path = "lib/knotes-vault" }
knotes-index = { path = "lib/knotes-index" }
rusqlite = { version = "0.42.0", features = ["bundled", "array"] }
memmap2 = "0.9.12"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
unicode-normalization = "0.1.26"
notify = "8.2.2"
serde_json = "1.0.154"
knotes-search = { path = "lib/knotes-search" }
knotes-indexer = { path = "lib/knotes-indexer" }
knotes-app = { path = "lib/knotes-app" }
knotes-session = { path = "lib/knotes-session" }
knotes-editor = { path = "lib/knotes-editor" }
knotes-pdf = { path = "lib/knotes-pdf" }
knotes-tools = { path = "lib/knotes-tools" }
knotes-chat = { path = "lib/knotes-chat" }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
knotes-alloc = { path = "lib/knotes-alloc" }
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
rayon = "1.12.0"
tempfile = "3"
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
ratex-font = "0.1.15"
ratex-font-loader = "0.1.15"
ab_glyph = "0.2.32"

[profile.release]
lto = "thin"
debug = "line-tables-only"
