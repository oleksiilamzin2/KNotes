[package]
name = "knotes"
description = "Knotes: native macOS knowledge base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
knotes-alloc.workspace = true
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
dispatch2 = "0.3.1"
block2 = "0.6.2"
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFView", "PDFDocument", "PDFPage", "objc2-app-kit"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
knotes-app.workspace = true
knotes-core.workspace = true
knotes-session.workspace = true
knotes-index.workspace = true
knotes-md.workspace = true
knotes-editor.workspace = true
knotes-vault.workspace = true
knotes-search.workspace = true

[dev-dependencies]
knotes-synth.workspace = true
serde_json.workspace = true
tempfile.workspace = true
