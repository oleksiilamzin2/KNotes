[package]
name = "knotes-llama"
description = "EmbeddingGemma run through llama.cpp on the GPU: the embedder inside the helper process (ADR 0028)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
knotes-embed.workspace = true
# From git until a crates.io release carries a llama.cpp that runs EmbeddingGemma 2 (0.1.161
# predates it; this commit bundles llama.cpp of 2026-11-04, ADR 0029).
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "d94c59486926bfbaa2e7ebfcf142fcfc3be24ede", default-features = false, features = ["metal"] }
